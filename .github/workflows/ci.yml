name: Python tests and security checks

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    env:
      AUDIT_SECRET_KEY: "ci-only-test-key-for-audit-signing-2026"
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[server,test]"

    - name: Check Python syntax and installed CLI
      run: |
        python -m compileall -q agents onco_cardiology_toxicity_agent cli.py enrichment.py onco_cardio_sentinel.py simulator.py
        onco-cardio-agent audit --task-id CI-SMOKE --target SYNTH-CI --primary 1 --secondary 1 --status NOMINAL

    - name: Validate browser JavaScript syntax
      run: |
        node -e 'const fs=require("fs"),vm=require("vm"); const h=fs.readFileSync("web/index.html","utf8"); new vm.Script(h.split("<script>")[1].split("</script>")[0]);'

    - name: Run Pytest Suite
      run: |
        pytest -q

    - name: Security SAST & Zero-PHI Audit
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('Audit signature check passed')
        "
