[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "onco-cardiology-toxicity-engine"
version = "2.0.0"
description = "OncoCardio Sentinel: Anthracycline & Immune Checkpoint Myocarditis Risk Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.110,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
onco-cardiology-toxicity-engine = "onco_cardiology_toxicity_agent.cli:main"
onco-cardio-agent = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/onco-cardiology-toxicity-agent"
Repository = "https://github.com/abusuraihsakhri/onco-cardiology-toxicity-engine.git"

[tool.setuptools]
py-modules = ["cli", "enrichment", "onco_cardio_sentinel", "simulator"]

[tool.setuptools.packages.find]
include = ["agents", "agents.*", "onco_cardiology_toxicity_agent", "onco_cardiology_toxicity_agent.*"]
